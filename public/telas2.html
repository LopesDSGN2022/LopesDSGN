<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Projeto | Lopes DSGN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    .projeto-header {
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      padding: 60px 0 50px;
      border-bottom: 2px solid #7B61FF;
    }

    .projeto-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }

    .projeto-subtitle {
      color: #c9beff;
      font-size: 1.1rem;
    }

    .btn-voltar {
      background: transparent;
      border: 1px solid #7B61FF;
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .btn-voltar:hover {
      background: #7B61FF;
    }

    .banner-section {
      background: #0c0c0c;
      padding: 40px 0;
    }

    .banner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .banner-item {
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .banner-item:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 30px rgba(123,97,255,.3);
    }

    .banner-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .artes-section {
      background: #000;
      padding: 50px 0 60px;
    }

    .section-title {
      text-align: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 30px;
      border-bottom: 2px solid #7B61FF;
      padding-bottom: 10px;
    }

    .artes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .arte-item {
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .arte-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(123,97,255,.4);
    }

    .arte-item img {
      width: 100%;
      display: block;
    }

    .image-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.95);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .image-modal.active {
      display: flex;
    }

    .modal-content-img {
      max-width: 90%;
      max-height: 90vh;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 40px;
      color: #fff;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .projeto-title { font-size: 1.8rem; }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<section class="projeto-header text-center">
  <div class="container">
    <a href="/projetos" class="btn-voltar">
      <i class="fas fa-arrow-left"></i> Voltar aos Projetos
    </a>

    <h1 class="projeto-title" id="projetoNome">Carregando...</h1>
    <p class="projeto-subtitle">Identidade Visual Completa</p>

    <p class="text-light mt-3 mx-auto" style="max-width: 720px; opacity: .85;" id="projetoDescricao"></p>

    <!-- CARROSSEL -->
    <div id="carouselProjeto" class="carousel slide mt-4" data-bs-ride="carousel">
      <div class="carousel-inner" id="carouselInner"></div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselProjeto" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselProjeto" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
</section>

<!-- MOCKUPS -->
<section class="banner-section">
  <div class="container">
    <h2 class="section-title">Aplicações da Marca</h2>
    <div class="banner-grid" id="bannersGrid"></div>
  </div>
</section>

<!-- ARTES -->
<section class="artes-section">
  <div class="container">
    <h2 class="section-title">Artes Criadas</h2>
    <div class="artes-grid" id="artesGrid"></div>
  </div>
</section>

<!-- MODAL -->
<div id="imageModal" class="image-modal">
  <span class="modal-close" id="modalClose">&times;</span>
  <img id="modalImage" class="modal-content-img">
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const projetosData = {
  barnno: {
    nome: "Barnno",
    pasta: "barnno",
    descricao: "Projeto de identidade visual com foco em posicionamento premium e aplicações digitais."
  }
};

const params = new URLSearchParams(window.location.search);
const slug = params.get("projeto");

const projetoNome = document.getElementById("projetoNome");
const projetoDescricao = document.getElementById("projetoDescricao");
const carouselInner = document.getElementById("carouselInner");
const bannersGrid = document.getElementById("bannersGrid");
const artesGrid = document.getElementById("artesGrid");

if (!slug || !projetosData[slug]) {
  document.body.innerHTML = "<h2 style='color:#fff;text-align:center;padding:100px'>Projeto não encontrado</h2>";
} else {
  const projeto = projetosData[slug];
  const basePath = `images/marcas/${projeto.pasta}/`;

  projetoNome.textContent = projeto.nome;
  projetoDescricao.textContent = projeto.descricao || "";

  // CARROSSEL (até 5 banners)
  let slideAtivo = false;
  for (let i = 1; i <= 5; i++) {
    const path = `${basePath}banner${i}.webp`;
    const slide = document.createElement("div");
    slide.className = "carousel-item";

    slide.innerHTML = `<img src="${path}" class="d-block w-100 rounded-4"
      onerror="this.parentElement.remove()">`;

    carouselInner.appendChild(slide);
    if (!slideAtivo) {
      slide.classList.add("active");
      slideAtivo = true;
    }
  }

  // MOCKUPS
  for (let i = 1; i <= 5; i++) {
    const path = `${basePath}mockup${i}.webp`;
    const div = document.createElement("div");
    div.className = "banner-item";
    div.innerHTML = `<img src="${path}" onerror="this.parentElement.remove()">`;
    div.onclick = () => openModal(path);
    bannersGrid.appendChild(div);
  }

  // ARTES
  for (let i = 1; i <= 10; i++) {
    const path = `${basePath}arte${i}.webp`;
    const div = document.createElement("div");
    div.className = "arte-item";
    div.innerHTML = `<img src="${path}" onerror="this.parentElement.remove()">`;
    div.onclick = () => openModal(path);
    artesGrid.appendChild(div);
  }
}

const modal = document.getElementById("imageModal");
const modalImg = document.getElementById("modalImage");
const modalClose = document.getElementById("modalClose");

function openModal(src) {
  modal.classList.add("active");
  modalImg.src = src;
  document.body.style.overflow = "hidden";
}

modalClose.onclick = () => {
  modal.classList.remove("active");
  document.body.style.overflow = "auto";
};
</script>

</body>
</html>
